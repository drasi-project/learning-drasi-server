host: 0.0.0.0
port: 8080
logLevel: info
persistConfig: true
enableUi: true
pluginRegistry: ghcr.io/drasi-project
autoInstallPlugins: true
plugins:
  - ref: source/postgres
  - ref: bootstrap/postgres
  - ref: reaction/log
verifyPlugins: true
hotReloadPlugins: false
hotReloadDebounceMs: 2000
instances:
  - id: ccc77569-0c72-4865-ac2b-3cde1ef03d8d
    allowExternalComponentIds: true
    persistIndex: false
    sources:
      - kind: postgres
        id: b898ddaf-e587-4ff9-8080-e415973d9a17
        name: my-postgres
        autoStart: true
        database: getting_started
        host: ${DB_HOST:-localhost}
        password: drasi_password
        port: 5432
        publicationName: drasi_pub
        slotName: drasi_slot
        sslMode: prefer
        tableKeys:
          - keyColumns:
              - MessageId
            table: Message
        tables:
          - Message
        user: drasi_user
    queries:
      - id: 3ec258b5-cc13-4b58-946e-abd4767e5197
        name: all-messages
        autoStart: true
        query: |
          MATCH (m:Message)
          RETURN m.MessageId AS MessageId, m.From AS From, m.Message AS Message
        queryLanguage: GQL
        middleware: []
        inputs:
          - component: {id: b898ddaf-e587-4ff9-8080-e415973d9a17}
            nodes: []
            relations: []
            pipeline: []
        enableBootstrap: true
        priorityQueueCapacity: 10000
        dispatchBufferCapacity: 1000
        outboxCapacity: 1000
        bootstrapTimeoutSecs: 300
      - id: b53116e6-d1e8-41e4-b9e6-56e2a11544cb
        name: hello-world-senders
        autoStart: true
        query: MATCH (m:Message) WHERE m.Message = 'Hello World' RETURN m.MessageId AS Id, m.From AS Sender
        queryLanguage: Cypher
        middleware: []
        inputs:
          - component: {id: b898ddaf-e587-4ff9-8080-e415973d9a17}
            nodes: []
            relations: []
            pipeline: []
        enableBootstrap: true
        outboxCapacity: 1000
        bootstrapTimeoutSecs: 300
      - id: f6fe8946-2df9-4ddf-9384-cf120b6427aa
        name: message-counts
        autoStart: true
        query: MATCH (m:Message) RETURN m.Message AS MessageText, count(m) AS Count
        queryLanguage: Cypher
        middleware: []
        inputs:
          - component: {id: b898ddaf-e587-4ff9-8080-e415973d9a17}
            nodes: []
            relations: []
            pipeline: []
        enableBootstrap: true
        outboxCapacity: 1000
        bootstrapTimeoutSecs: 300
    reactions:
      - kind: log
        id: b1ca5c77-5a52-4fec-a2bc-eb3040deb6bc
        name: log-reaction
        queries:
          - {id: 3ec258b5-cc13-4b58-946e-abd4767e5197}
          - {id: b53116e6-d1e8-41e4-b9e6-56e2a11544cb}
        autoStart: true
    identityProviders: []
