# =============================================================================
# Drasi Server - OTel Observability Tutorial
# =============================================================================
# Correlates Kubernetes Deployments, OTel-projected service health, and a
# PostgreSQL SLO policy. Mock store services export OTLP through an in-cluster
# Collector; six queries share health and heartbeat calculations.
# =============================================================================

apiVersion: drasi.io/v1
host: "${SERVER_HOST:-127.0.0.1}"
port: ${SERVER_PORT:-8380}
logLevel: "${LOG_LEVEL:-info}"
persistConfig: false

# Only matching, hash-verified local libraries from scripts/demo.py build.
autoInstallPlugins: false
verifyPlugins: false
pluginRegistry: "${DRASI_PLUGINS_DIR}"

# =============================================================================
# Sources
# =============================================================================
instances:
  - id: otel-observability-server
    sources:
      - kind: postgres
        id: d0b24e57-1f5e-4855-98e8-fcf797dc34e5
        name: slo
        autoStart: true
        host: "127.0.0.1"
        port: ${POSTGRES_PORT:-5732}
        database: otel_observability
        user: drasi_user
        password: drasi_password
        sslMode: prefer
        tables:
          - service_slo_policy
        slotName: drasi_otel_observability_slot
        publicationName: drasi_otel_observability_pub
        tableKeys:
          - table: service_slo_policy
            keyColumns:
              - service_name
              - metric_name
        bootstrapProvider:
          kind: postgres

      - kind: kubernetes
        id: 36a47b94-1435-4e1c-87cd-2a1270883f52
        name: k8s
        autoStart: true
        resources:
          - apiVersion: apps/v1
            kind: Deployment
        namespaces:
          - "${K8S_NAMESPACE:-otel-observability}"
        authMode: kubeconfig
        kubeconfigPath: "${KUBECONFIG_PATH}"
        bootstrapProvider:
          kind: kubernetes

  # No bootstrap: late subscribers wait for the next OTLP export. The mock
  # services keep sending, so the graph fills in within a few seconds.
      - kind: otel
        id: 7de527cf-aed8-478b-93a3-c4008991ade1
        name: otel
        autoStart: true
        grpcBind: "${OTEL_GRPC_BIND:-0.0.0.0:14317}"
        httpBind: "${OTEL_HTTP_BIND:-0.0.0.0:14318}"
        metricAllowlist:
          - latency_p99_ms
          - health.heartbeat
        heartbeatMetric: health.heartbeat
        destinationAttributes:
          - peer.service
        spanKinds:
          - CLIENT
        dependencyTtlSecs: 60

# =============================================================================
# Continuous Queries
# =============================================================================
    queries:
  # Always-on view of the current deployment + live p99. Used by the dashboard
  # even when no SLO alert is firing.
      - id: 97471d43-3175-45e4-a663-0cbf726b2739
        name: current-health
        autoStart: true
        queryLanguage: Cypher
        result:
          label: ServiceHealth
        query: |
          MATCH (d:Deployment)-[:RUNS]->(s:Service)-[:REPORTS]->(m:Metric)
          WHERE m.name = 'latency_p99_ms'
          RETURN
            s.version AS deployVersion,
            d.version AS rolloutVersion,
            s.name AS service,
            m.name AS metricName,
            m.value AS latencyMs
        inputs:
          - component: k8s
            nodes:
              - Deployment
            pipeline:
              - promote-version
          - component: otel
            nodes:
              - Service
              - Metric
            relations:
              - REPORTS
        joins:
          - id: RUNS
            keys:
              - label: Deployment
                property: name
              - label: Service
                property: name
        middleware:
          - kind: promote
            name: promote-version
            config:
              mappings:
                - path: "$.labels.version"
                  target_name: version
              on_error: skip

  # KPI / gauge must not aggregate frontend and payments (80 / 120 / 400)
  # or the dashboard jumps as those rows arrive.
      - id: 0569fc47-5ba8-470d-87d1-eb007dadeb5e
        name: checkout-health
        autoStart: true
        queryLanguage: Cypher
        result:
          label: CheckoutHealth
        query: |
          MATCH (h:ServiceHealth)
          WHERE h.service = 'checkout'
          RETURN
            h.deployVersion AS deployVersion,
            h.service AS service,
            h.latencyMs AS latencyMs
        inputs:
          - current-health

  # Validated OSMC story query: fire only after the metric stays above the
  # policy threshold for five seconds.
      - id: 7b55919e-aefa-4510-8f9e-4fe4b05fbf33
        name: slo-alert
        autoStart: true
        queryLanguage: Cypher
        result:
          label: SloAlert
        query: |
          MATCH (h:ServiceHealth)-[:GOVERNED_BY]->(p:service_slo_policy)
          WHERE h.metricName = p.metric_name
            AND drasi.trueFor(
              h.deployVersion = h.rolloutVersion AND h.latencyMs > p.threshold_ms,
              duration({ seconds: 5 })
            )
          RETURN
            h.deployVersion AS deployVersion,
            h.service AS service,
            h.latencyMs AS latencyMs,
            p.threshold_ms AS thresholdMs
        inputs:
          - current-health
          - component: slo
            nodes:
              - service_slo_policy
        joins:
          - id: GOVERNED_BY
            keys:
              - label: ServiceHealth
                property: service
              - label: service_slo_policy
                property: service_name
      - id: d37d4c90-e044-4e98-a66b-6b7a6c2b7f21
        name: service-dependencies
        autoStart: true
        queryLanguage: Cypher
        result:
          label: ServiceDependency
        query: |
          MATCH (a:Service)-[:DEPENDS_ON]->(b:Service)
          RETURN a.name AS fromService, b.name AS toService
        inputs:
          - component: otel
            nodes:
              - Service
            relations:
              - DEPENDS_ON

  # Live pulse. value > 0 is on; 0 is an explicit /heartbeat/off.
      - id: a7024e87-9e2a-4d9e-b65f-99df9c471a26
        name: checkout-heartbeat
        autoStart: true
        queryLanguage: Cypher
        result:
          label: CheckoutHeartbeat
        query: |
          MATCH (svc:Service)-[:REPORTS]->(m:Metric)
          WHERE svc.name = 'checkout'
            AND m.name = 'health.heartbeat'
          RETURN
            svc.name AS service,
            m.value AS pulse,
            m.receivedAt AS lastSeen
        inputs:
          - component: otel
            nodes:
              - Service
              - Metric
            relations:
              - REPORTS

  # Missing when checkout sends pulse 0, or when the last pulse is older
  # than 10 seconds (process gone, no export at all).
      - id: fd251a01-8e67-453b-ac4a-50d6ffb1b6b3
        name: missing-heartbeat
        autoStart: true
        queryLanguage: Cypher
        result:
          label: MissingHeartbeat
        query: |
          MATCH (h:CheckoutHeartbeat)
          WHERE (
                  h.pulse <= 0
                  OR drasi.trueNowOrLater(
                       datetime(h.lastSeen) <= (datetime.realtime() - duration({ seconds: 10 })),
                       datetime(h.lastSeen) + duration({ seconds: 10 })
                     )
                )
          RETURN h.service AS service
        inputs:
          - checkout-heartbeat

# =============================================================================
# Reactions
# =============================================================================
    reactions:
      - kind: dashboard
        id: 94ac6021-1d21-4211-ae7a-bbac3158a8b7
        name: otel-observability-dashboard
        autoStart: true
        queries:
          - current-health
          - checkout-health
          - checkout-heartbeat
          - slo-alert
          - service-dependencies
          - missing-heartbeat
        host: "${DASHBOARD_HOST:-127.0.0.1}"
        port: ${DASHBOARD_PORT:-3000}
        heartbeatIntervalMs: 15000
        predefinedDashboards:
          - id: otel-observability
            name: OTel Observability
            gridOptions:
              columns: 12
              rowHeight: 60
              margin: 10
            widgets:
              - id: alert-count
                type: kpi
                title: Active SLO Alerts
                grid: {x: 0, y: 0, w: 3, h: 3}
                config:
                  queryId: 7b55919e-aefa-4510-8f9e-4fe4b05fbf33
                  valueField: service
                  aggregation: count
                  label: Firing

              - id: latency-kpi
                type: kpi
                title: Checkout p99
                grid: {x: 3, y: 0, w: 3, h: 3}
                config:
                  queryId: 0569fc47-5ba8-470d-87d1-eb007dadeb5e
                  valueField: latencyMs
                  aggregation: max
                  label: ms

              - id: latency-gauge
                type: gauge
                title: Checkout Latency
                grid: {x: 6, y: 0, w: 3, h: 4}
                config:
                  queryId: 0569fc47-5ba8-470d-87d1-eb007dadeb5e
                  valueField: latencyMs
                  aggregation: max
                  min: 0
                  max: 1500

              - id: missing-count
                type: kpi
                title: Missing Heartbeats
                grid: {x: 9, y: 0, w: 3, h: 3}
                config:
                  queryId: fd251a01-8e67-453b-ac4a-50d6ffb1b6b3
                  valueField: service
                  aggregation: count
                  label: Stale

              - id: health-table
                type: table
                title: Current Health
                grid: {x: 0, y: 3, w: 6, h: 4}
                config:
                  queryId: 97471d43-3175-45e4-a663-0cbf726b2739
                  columns:
                    - deployVersion
                    - service
                    - latencyMs

              - id: slo-alerts
                type: text
                title: SLO Alerts
                grid: {x: 9, y: 3, w: 3, h: 4}
                config:
                  queryId: 7b55919e-aefa-4510-8f9e-4fe4b05fbf33
                  template: |
                    {{#if count}}
                    {{#each rows}}
                    - ⚠️ **{{this.service}}** `{{this.deployVersion}}` — {{this.latencyMs}} ms > {{this.thresholdMs}} ms
                    {{/each}}
                    {{else}}
                    ✅ No SLO alerts.
                    {{/if}}

              - id: dependencies
                type: graph
                title: Service Dependencies
                grid: {x: 0, y: 7, w: 6, h: 5}
                config:
                  queryId: d37d4c90-e044-4e98-a66b-6b7a6c2b7f21
                  nodeField: fromService
                  connectsToField: toService
                  layout: force

              - id: missing-heartbeats
                type: text
                title: Checkout heartbeat
                grid: {x: 6, y: 4, w: 3, h: 7}
                config:
                  queryId: a7024e87-9e2a-4d9e-b65f-99df9c471a26
                  template: |
                    {{#if count}}
                    {{#each rows}}
                    {{#if this.pulse}}
                    ✅ **{{this.service}}** last seen `{{this.lastSeen}}`
                    {{else}}
                    💔 **{{this.service}}** heartbeat disabled
                    {{/if}}
                    {{/each}}
                    {{else}}
                    ⏳ No heartbeat received yet.
                    {{/if}}

      - kind: log
        id: c51cd132-93fb-4a07-b4d9-7e14d120ae41
        name: console-log
        autoStart: true
        queries:
          - slo-alert
          - service-dependencies
          - missing-heartbeat
        defaultTemplate:
          added:
            template: "[{{query_name}}] + {{after}}"
          updated:
            template: "[{{query_name}}] ~ {{before}} -> {{after}}"
          deleted:
            template: "[{{query_name}}] - {{before}}"

  # ===========================================================================
  # Optional: Discord alerts (HTTP reaction)
  # ===========================================================================
  # Posts when slo-alert or missing-heartbeat is Added or Removed. To enable:
  #   1. The local build includes reaction/http; no registry download is needed.
  #   2. Uncomment this reaction block (remove the leading "# " on each line).
  #   3. Set DISCORD_WEBHOOK_URL and restart the server.
  # See "Optional: Discord Alerts" in the tutorial for the walkthrough.
