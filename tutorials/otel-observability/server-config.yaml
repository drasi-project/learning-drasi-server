  #       id: discord-alerts
  #       autoStart: true
  #       queries:
  #         - slo-alert
  #         - missing-heartbeat
  #       baseUrl: "${DISCORD_WEBHOOK_URL}"
  #       timeoutMs: 30000
  #       outputTemplates:
  #         routes:
  #           slo-alert:
  #             added:
