      #           template: |
      #             {
      #               "content": "🚨 **High risk container updated**\n• **Pod:** `{{after.pod}}`\n• **Image:** `{{after.image}}`\n• **Reason:** {{after.reason}}\n• **Mitigation:** {{after.mitigation}}"
