# Two independent databases for the Curbside Pickup tutorial:
#   - postgres : the Retail Operations store (orders)
#   - mysql    : the Physical Operations store (vehicles)
# Both are configured for change data capture (CDC) so Drasi Server can stream
# their changes in real time.

name: ${COMPOSE_PROJECT_NAME:-curbside-pickup-cg}

services:
  # ---------------------------------------------------------------------------
  # Retail Operations - PostgreSQL (orders)
  # ---------------------------------------------------------------------------
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-curbside-pickup-cg}-postgres
    labels:
      io.drasi.curbside-pickup.path: ${DRASI_TUTORIAL_DIR:?Run scripts/demo.py}
      io.drasi.curbside-pickup.run: ${DRASI_DEMO_DIR:?Run scripts/demo.py}
    environment:
      POSTGRES_DB: RetailOperations
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_admin
    command:
      # wal_level=logical is required for logical replication (CDC).
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5742}:5432"
    volumes:
      - curbside_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Probe over TCP (-h localhost), not the Unix socket. On first init the
      # postgres image runs a temporary socket-only server to create POSTGRES_DB;
      # a socket probe can report "ready" before RetailOperations exists.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d RetailOperations"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Physical Operations - MySQL (vehicles)
  # ---------------------------------------------------------------------------
  # The Drasi MySQL source captures changes from the binary log (binlog), so the
  # server is started with ROW-based binary logging, full row images, full row
  # metadata (column names) and GTID mode - all required by the source. The
  # drasi_user is granted REPLICATION SLAVE / REPLICATION CLIENT in
  # database/mysql-init.sql so it can stream the binlog.
  mysql:
    image: docker.io/library/mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-curbside-pickup-cg}-mysql
    labels:
      io.drasi.curbside-pickup.path: ${DRASI_TUTORIAL_DIR:?Run scripts/demo.py}
      io.drasi.curbside-pickup.run: ${DRASI_DEMO_DIR:?Run scripts/demo.py}
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_admin}"
      MYSQL_DATABASE: PhysicalOperations
      MYSQL_USER: drasi_user
      MYSQL_PASSWORD: drasi_password
    command:
      - "--server-id=1"
      - "--log-bin=mysql-bin"
      - "--binlog-format=ROW"
      - "--binlog-row-image=FULL"
      - "--binlog-row-metadata=FULL"
      - "--gtid-mode=ON"
      - "--enforce-gtid-consistency=ON"
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3309}:3306"
    volumes:
      - curbside_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  curbside_postgres_data:
    labels:
      io.drasi.curbside-pickup.path: ${DRASI_TUTORIAL_DIR:?Run scripts/demo.py}
      io.drasi.curbside-pickup.run: ${DRASI_DEMO_DIR:?Run scripts/demo.py}
  curbside_mysql_data:
    labels:
      io.drasi.curbside-pickup.path: ${DRASI_TUTORIAL_DIR:?Run scripts/demo.py}
      io.drasi.curbside-pickup.run: ${DRASI_DEMO_DIR:?Run scripts/demo.py}

networks:
  default:
    labels:
      io.drasi.curbside-pickup.path: ${DRASI_TUTORIAL_DIR:?Run scripts/demo.py}
      io.drasi.curbside-pickup.run: ${DRASI_DEMO_DIR:?Run scripts/demo.py}
