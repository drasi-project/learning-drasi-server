# Prometheus for the optional Getting Started telemetry page.
# Development only: no credentials, TLS, remote write or alerting.
# scripts/telemetry.py writes the single target (Server's management port,
# reached from the Podman VM as host.containers.internal:<SERVER_PORT>) into
# the run's state directory and mounts it read-only at /etc/prometheus/targets/.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: drasi-server
    metrics_path: /metrics
    scheme: http
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/drasi-server.json
        refresh_interval: 5s
