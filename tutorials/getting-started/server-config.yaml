apiVersion: drasi.io/v1
host: 127.0.0.1
port: ${SERVER_PORT:-8180}
logLevel: info
persistConfig: true
enableUi: false
autoInstallPlugins: false
instances:
  - id: getting-started-server
    persistIndex: false
    sources:
      - kind: postgres
        id: my-postgres
        autoStart: true
        host: 127.0.0.1
        port: ${POSTGRES_PORT:-5532}
        database: getting_started
        user: drasi_user
        password: drasi_password
        tables: [Message]
        slotName: drasi_slot
        publicationName: drasi_pub
        sslMode: disable
        tableKeys:
          - table: Message
            keyColumns: [MessageId]
        bootstrapProvider:
          kind: postgres
      - kind: http
        id: location-tracker
        autoStart: true
        host: 127.0.0.1
        port: ${HTTP_PORT:-8182}
        bootstrapProvider:
          kind: scriptfile
          filePaths: ["../../locations.jsonl"]
    queries:
      - id: all-messages
        autoStart: true
        inputs: [my-postgres]
        result: {label: Message}
        query: |
          MATCH (m:Message)
          RETURN m.MessageId AS MessageId, m.From AS From, m.Message AS Message
        queryLanguage: GQL
      - id: hello-world-senders
        autoStart: true
        inputs: [all-messages]
        result: {label: HelloWorldSender}
        query: MATCH (m:Message) WHERE m.Message = 'Hello World' RETURN m.MessageId AS Id, m.From AS Sender
        queryLanguage: Cypher
      - id: message-counts
        autoStart: true
        inputs: [all-messages]
        result: {label: MessageCount}
        query: MATCH (m:Message) RETURN m.Message AS MessageText, count(m) AS Count
        queryLanguage: Cypher
      - id: inactive-senders
        autoStart: true
        inputs: [my-postgres]
        result: {label: InactiveSender}
        query: |
          MATCH (m:Message)
          WITH m.From AS MessageFrom, max(drasi.changeDateTime(m)) AS LastMessageTimestamp
          WHERE LastMessageTimestamp <= datetime.realtime() - duration({ seconds: 20 })
            OR drasi.trueLater(LastMessageTimestamp <= datetime.realtime() - duration({ seconds: 20 }),
                               LastMessageTimestamp + duration({ seconds: 20 }))
          RETURN MessageFrom, LastMessageTimestamp
        queryLanguage: Cypher
      - id: messages-with-location
        autoStart: true
        inputs: [all-messages, location-tracker]
        result: {label: LocatedMessage}
        query: |
          MATCH (m:Message)-[:FROM_USER]->(u:UserLocation)
          RETURN m.MessageId AS Id, m.Message AS Message,
                 m.From AS Sender, u.location AS Location, u.status AS Status
        queryLanguage: Cypher
        joins:
          - id: FROM_USER
            keys:
              - {label: Message, property: From}
              - {label: UserLocation, property: name}
    reactions:
      - kind: log
        id: log-reaction
        autoStart: true
        queries: [all-messages, hello-world-senders]
