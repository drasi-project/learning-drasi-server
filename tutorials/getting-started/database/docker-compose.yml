# Reference equivalent of scripts/demo.py database; use the helper for ownership checks.
services:
  postgres:
    image: docker.io/library/postgres:14-alpine
    container_name: "${DRASI_RUN_ID:-getting-started-cg}-postgres"
    environment:
      POSTGRES_DB: getting_started
      POSTGRES_PASSWORD: postgres_admin
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=10, -c, max_wal_senders=10]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5532}:5432"
    volumes:
      - getting_started_postgres_data:/var/lib/postgresql/data
    labels:
      io.drasi.getting-started.owner: "${DRASI_OWNER_DIR:?Use scripts/demo.py database}"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d getting_started"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  getting_started_postgres_data:
    name: "${DRASI_RUN_ID:-getting-started-cg}-postgres-data"
    labels:
      io.drasi.getting-started.owner: "${DRASI_OWNER_DIR:?Use scripts/demo.py database}"
