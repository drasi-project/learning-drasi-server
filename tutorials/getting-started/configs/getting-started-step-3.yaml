apiVersion: drasi.io/v1
host: 127.0.0.1
port: ${SERVER_PORT:-8180}
logLevel: info
persistConfig: true
enableUi: false
autoInstallPlugins: false
instances:
  - id: getting-started-server
    persistIndex: false
    sources:
      - kind: postgres
        id: my-postgres
        autoStart: true
        host: 127.0.0.1
        port: ${POSTGRES_PORT:-5532}
        database: getting_started
        user: drasi_user
        password: drasi_password
        tables: [Message]
        slotName: drasi_slot
        publicationName: drasi_pub
        sslMode: disable
        tableKeys:
          - table: Message
            keyColumns: [MessageId]
        bootstrapProvider:
          kind: postgres
    queries:
      - id: all-messages
        autoStart: true
        inputs: [my-postgres]
        result:
          label: Message
        query: |
          MATCH (m:Message)
          RETURN m.MessageId AS MessageId, m.From AS From, m.Message AS Message
        queryLanguage: GQL
    reactions:
      - kind: log
        id: log-reaction
        autoStart: true
        queries: [all-messages]
