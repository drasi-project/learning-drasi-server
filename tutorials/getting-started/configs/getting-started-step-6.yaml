apiVersion: drasi.io/v1
host: 127.0.0.1
port: ${SERVER_PORT:-8180}
logLevel: info
persistConfig: true
enableUi: false
autoInstallPlugins: false
instances:
  - id: getting-started-server
    allowExternalComponentIds: true
    persistIndex: false
    sources:
      - kind: postgres
        id: 7d38f9ea-27f0-4a2d-830c-da910ed68b6b
        name: my-postgres
        autoStart: true
        host: 127.0.0.1
        port: ${POSTGRES_PORT:-5532}
        database: getting_started
        user: drasi_user
        password: drasi_password
        tables: [Message]
        slotName: drasi_slot
        publicationName: drasi_pub
        sslMode: disable
        tableKeys:
          - table: Message
            keyColumns: [MessageId]
        bootstrapProvider:
          kind: postgres
    queries:
      - id: 67ff1d64-e938-4a9b-b80e-074666bdef95
        name: all-messages
        autoStart: true
        inputs: [{id: 7d38f9ea-27f0-4a2d-830c-da910ed68b6b}]
        result: {label: Message}
        query: |
          MATCH (m:Message)
          RETURN m.MessageId AS MessageId, m.From AS From, m.Message AS Message
        queryLanguage: GQL
      - id: 420bc6f5-d87a-4f99-9c79-7f88a7f0a88e
        name: hello-world-senders
        autoStart: true
        inputs: [{id: 67ff1d64-e938-4a9b-b80e-074666bdef95}]
        result: {label: HelloWorldSender}
        query: MATCH (m:Message) WHERE m.Message = 'Hello World' RETURN m.MessageId AS Id, m.From AS Sender
        queryLanguage: Cypher
      - id: ac1a10bb-59c8-4572-9bf7-c610f166c19d
        name: message-counts
        autoStart: true
        inputs: [{id: 67ff1d64-e938-4a9b-b80e-074666bdef95}]
        result: {label: MessageCount}
        query: MATCH (m:Message) RETURN m.Message AS MessageText, count(m) AS Count
        queryLanguage: Cypher
      - id: 193fae0b-7cc9-4cfc-bc87-1672662fa02c
        name: inactive-senders
        autoStart: true
        inputs: [{id: 7d38f9ea-27f0-4a2d-830c-da910ed68b6b}]
        result: {label: InactiveSender}
        query: |
          MATCH (m:Message)
          WITH m.From AS MessageFrom, max(drasi.changeDateTime(m)) AS LastMessageTimestamp
          WHERE LastMessageTimestamp <= datetime.realtime() - duration({ seconds: 20 })
            OR drasi.trueLater(LastMessageTimestamp <= datetime.realtime() - duration({ seconds: 20 }),
                               LastMessageTimestamp + duration({ seconds: 20 }))
          RETURN MessageFrom, LastMessageTimestamp
        queryLanguage: Cypher
    reactions:
      - kind: log
        id: 92e8fa7a-bd91-46a3-95ff-8c364677f077
        name: log-reaction
        autoStart: true
        queries:
          - {id: 67ff1d64-e938-4a9b-b80e-074666bdef95}
          - {id: 420bc6f5-d87a-4f99-9c79-7f88a7f0a88e}
