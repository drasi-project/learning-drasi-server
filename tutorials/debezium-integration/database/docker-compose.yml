# Infrastructure for the Debezium ↔ Drasi Server tutorial.
#
# Profiles:
#   (default)     PostgreSQL only
#   http          + Debezium Server (HTTP sink → Drasi HTTP source)
#   kafka         + Kafka + Debezium Connect (topics → Drasi Kafka source)
#
# Examples:
#   docker compose --profile http up -d
#   docker compose --profile kafka up -d

name: debezium-integration

services:
  postgres:
    image: postgres:16-alpine
    container_name: debezium-integration-postgres
    environment:
      POSTGRES_DB: building_comfort
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_admin
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    ports:
      - "${POSTGRES_HOST_PORT:-5752}:5432"
    volumes:
      - debezium_integration_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d building_comfort"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - debezium-net

  # ---------------------------------------------------------------------------
  # Path 1: Debezium Server → HTTP → Drasi
  # ---------------------------------------------------------------------------
  debezium-server:
    profiles: ["http"]
    image: quay.io/debezium/server:2.7
    container_name: debezium-integration-server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # application.properties is the source of truth; these override the sink URL
      # so Codespaces / Linux Docker can reach Drasi on the host.
      DEBEZIUM_SINK_HTTP_URL: "${DEBEZIUM_SINK_HTTP_URL:-http://host.docker.internal:9080/debezium}"
    volumes:
      - ./debezium-server/application.properties:/debezium/conf/application.properties:ro
      - debezium_server_data:/debezium/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - debezium-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Path 2: Debezium on Kafka Connect → Kafka → Drasi
  # ---------------------------------------------------------------------------
  # Redpanda speaks the Kafka protocol. Dual listeners let Connect use the
  # internal address while Drasi Server (on the host) uses localhost.
  kafka:
    profiles: ["kafka"]
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: debezium-integration-kafka
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:${KAFKA_HOST_PORT:-19092}
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://kafka:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr kafka:33145
      - --advertise-rpc-addr kafka:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "${KAFKA_HOST_PORT:-19092}:19092"
      - "18081:18081"
      - "18082:18082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy.*true' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks:
      - debezium-net

  connect:
    profiles: ["kafka"]
    image: quay.io/debezium/connect:2.7
    container_name: debezium-integration-connect
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${CONNECT_HOST_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "debezium-integration"
      CONFIG_STORAGE_TOPIC: "debezium_connect_configs"
      OFFSET_STORAGE_TOPIC: "debezium_connect_offsets"
      STATUS_STORAGE_TOPIC: "debezium_connect_statuses"
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks:
      - debezium-net

volumes:
  debezium_integration_postgres_data:
  debezium_server_data:

networks:
  debezium-net:
    name: debezium-integration-net
