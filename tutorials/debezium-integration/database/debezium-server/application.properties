#
# Debezium Server configuration for Path 1 (HTTP sink → Drasi HTTP source).
# Docs: https://debezium.io/documentation/reference/stable/operations/debezium-server.html

# -----------------------------------------------------------------------------
# Sink: push change events to Drasi's HTTP source webhook
# -----------------------------------------------------------------------------
debezium.sink.type=http
# Overridden at runtime by DEBEZIUM_SINK_HTTP_URL when set in compose.
debezium.sink.http.url=http://host.docker.internal:9080/debezium
debezium.sink.http.timeout.ms=10000
debezium.sink.http.retries=10
debezium.sink.http.retry.interval.ms=2000

# -----------------------------------------------------------------------------
# Source: PostgreSQL connector (Building Comfort schema)
# -----------------------------------------------------------------------------
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=5000
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=drasi_user
debezium.source.database.password=drasi_password
debezium.source.database.dbname=building_comfort
debezium.source.topic.prefix=building
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=debezium_building
debezium.source.publication.name=dbz_building_pub
debezium.source.publication.autocreate.mode=filtered
debezium.source.table.include.list=public.Building,public.Floor,public.Room
debezium.source.snapshot.mode=initial
debezium.source.tombstones.on.delete=false

# Plain JSON envelopes (no Connect schema wrapper) so Drasi mappings stay simple.
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false
